services:
  - type: web
    name: arogyavani-voice-backend
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: SARVAM_API_KEY
        sync: false
      - key: ENABLE_RAG
        value: "false"
      - key: ENABLE_DOCUMENT_ELIGIBILITY
        value: "false"
